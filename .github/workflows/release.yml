name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies (required for GPUI compilation)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            libwayland-dev \
            libfontconfig1-dev

      - name: Build release binaries (CLI + GUI)
        run: cargo build --release --all-features --bins --target ${{ matrix.target }}

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="kfx-converter-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          cp "target/${{ matrix.target }}/release/kfx-conv" "$STAGE_DIR/"
          cp "target/${{ matrix.target }}/release/kfx-studio" "$STAGE_DIR/"
          [ -f README.md ] && cp README.md "$STAGE_DIR/" || true
          [ -f LICENSE ] && cp LICENSE "$STAGE_DIR/" || true
          tar -czf "${STAGE_DIR}.tar.gz" "$STAGE_DIR"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${STAGE_DIR}.tar.gz" > "${STAGE_DIR}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGE_DIR}.tar.gz" > "${STAGE_DIR}.tar.gz.sha256"
          fi

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stageDir = "kfx-converter-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\kfx-conv.exe" "$stageDir\"
          Copy-Item "target\${{ matrix.target }}\release\kfx-studio.exe" "$stageDir\"
          if (Test-Path README.md) { Copy-Item README.md "$stageDir\" }
          if (Test-Path LICENSE) { Copy-Item LICENSE "$stageDir\" }
          Compress-Archive -Path "$stageDir\*" -DestinationPath "$stageDir.zip" -Force
          $hash = (Get-FileHash "$stageDir.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stageDir.zip" | Out-File -Encoding ascii "$stageDir.zip.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            kfx-converter-${{ matrix.target }}.${{ matrix.archive_ext }}
            kfx-converter-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined checksums
        shell: bash
        run: |
          cd artifacts
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
