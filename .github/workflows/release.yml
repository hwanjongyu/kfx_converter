name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Linux system dependencies (required for GPUI compilation)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-gui-deps

      - name: Run full test suite (All features, Unit + Integration)
        run: cargo test --locked --all-features --verbose

      - name: Verify library compilation without default features
        run: cargo test --locked --lib --no-default-features --verbose

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Linux system dependencies (required for GPUI compilation)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-gui-deps

      - name: Build release binaries (CLI + GUI)
        run: cargo build --locked --release --all-features --bins --target ${{ matrix.target }}

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="kfx-converter-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          cp "target/${{ matrix.target }}/release/kfx-conv" "$STAGE_DIR/"
          cp "target/${{ matrix.target }}/release/kfx-studio" "$STAGE_DIR/"
          [ -f README.md ] && cp README.md "$STAGE_DIR/" || true
          [ -f LICENSE ] && cp LICENSE "$STAGE_DIR/" || true
          tar -czf "${STAGE_DIR}.tar.gz" "$STAGE_DIR"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${STAGE_DIR}.tar.gz" > "${STAGE_DIR}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGE_DIR}.tar.gz" > "${STAGE_DIR}.tar.gz.sha256"
          fi

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stageDir = "kfx-converter-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\kfx-conv.exe" "$stageDir\"
          Copy-Item "target\${{ matrix.target }}\release\kfx-studio.exe" "$stageDir\"
          if (Test-Path README.md) { Copy-Item README.md "$stageDir\" }
          if (Test-Path LICENSE) { Copy-Item LICENSE "$stageDir\" }
          Compress-Archive -Path "$stageDir\*" -DestinationPath "$stageDir.zip" -Force
          $hash = (Get-FileHash "$stageDir.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stageDir.zip" | Out-File -Encoding ascii "$stageDir.zip.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            kfx-converter-${{ matrix.target }}.${{ matrix.archive_ext }}
            kfx-converter-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined checksums
        shell: bash
        run: |
          cd artifacts
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
