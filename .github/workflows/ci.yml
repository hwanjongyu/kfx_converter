name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # =========================================================================
  # 1. Code Quality Gate: Fast Lint & Formatting Check (< 30s)
  # =========================================================================
  lint-and-format:
    name: Code Quality (fmt & clippy)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Linux system dependencies (required for GPUI compilation)
        uses: ./.github/actions/setup-linux-gui-deps

      - name: Check code formatting (cargo fmt)
        run: cargo fmt -- --check

      - name: Check Clippy lints (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # =========================================================================
  # 2. Multi-Platform Test Matrix: Linux, macOS & Windows (All Features)
  # =========================================================================
  test:
    name: Test (${{ matrix.os }})
    needs: lint-and-format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-gui-deps

      - name: Run full test suite (All features, Unit + Integration)
        run: cargo test --locked --all-features --verbose

      - name: Verify library compilation without default features
        run: cargo test --locked --lib --no-default-features --verbose

  # =========================================================================
  # 3. Test Coverage: cargo-llvm-cov + Summary Report & Artifact Upload
  # =========================================================================
  coverage:
    name: Test Coverage (cargo-llvm-cov)
    needs: lint-and-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Linux system dependencies
        uses: ./.github/actions/setup-linux-gui-deps

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate LCOV and summary coverage report
        run: |
          cargo llvm-cov --locked --no-report --all-features --workspace
          cargo llvm-cov report --lcov --output-path lcov.info
          echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov report --summary-only --fail-under-lines 60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  # =========================================================================
  # 4. Build & Docs Verification: Release Binaries (CLI + GUI) & Rustdoc
  # =========================================================================
  build-and-docs:
    name: Build & Docs Verification
    needs: lint-and-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Linux system dependencies
        uses: ./.github/actions/setup-linux-gui-deps

      - name: Build release binaries (CLI + GUI)
        run: cargo build --locked --release --all-features --bins

      - name: Verify rustdoc generation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

  # =========================================================================
  # 5. Security Audit: Dependency Vulnerability Check (cargo-audit)
  # =========================================================================
  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock for security advisories
        run: cargo audit
