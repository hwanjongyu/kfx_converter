[package]
name = "kfx-converter"
version = "0.1.0"
edition = "2024"
description = "High-performance native EPUB to Amazon KFX converter written in Rust"
authors = ["hwanjongyu"]

[lib]
name = "kfx_converter"
path = "src/lib.rs"

[[bin]]
name = "kfx-conv"
path = "src/main.rs"

[[bin]]
name = "kfx-studio"
path = "src/ui/main.rs"
required-features = ["gui"]

[dependencies]
# CLI & serialization
clap = { version = "4.5", features = ["derive"], optional = true }
byteorder = "1.5"
thiserror = "2.0"
libc = "0.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
sha1 = "0.10"
rusqlite = { version = "0.33", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tempfile = "3.17"
gpui = { version = "0.2.2", optional = true }

[features]
default = ["cli"]
cli = ["dep:clap"]
gui = ["dep:gpui"]

